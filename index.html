<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カフェ・ルポ | Cafe Repos</title>
  <style>
    /* ほっこり温かみのあるデザイン */
    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #fdfbf7;
      color: #4a4238;
      line-height: 1.6;
    }
    header {
      background-color: #e8d8c8;
      text-align: center;
      padding: 40px 20px;
    }
    h1 {
      margin: 0;
      font-size: 2.2rem;
      color: #5c4033;
    }
    .subtitle {
      font-size: 0.9rem;
      color: #8c7b70;
      margin-top: 5px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }
    section {
      background: #ffffff;
      margin-bottom: 25px;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.04);
    }
    h2 {
      color: #8b5a2b;
      border-bottom: 2px solid #f2e6d8;
      padding-bottom: 8px;
      margin-top: 0;
      font-size: 1.3rem;
    }
    .news-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .news-item {
      padding: 10px 0;
      border-bottom: 1px dashed #e8d8c8;
    }
    .news-item:last-child {
      border-bottom: none;
    }
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }
    .menu-card {
      background: #fdfbf7;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #f0e6d9;
    }
    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.8rem;
      color: #8c7b70;
    }
  </style>
</head>
<body>

  <header>
    <h1>カフェ・ルポ</h1>
    <div class="subtitle">心ほぐれる、手作り珈琲と焼き菓子の店</div>
  </header>

  <div class="container">
    
    <section>
      <h2>📢 お知らせ</h2>
      <ul class="news-list" id="news-container">
        <li class="news-item">読み込み中...</li>
      </ul>
    </section>

    <section>
      <h2>🕒 営業時間</h2>
      <p><strong>営業時間：</strong>11:00 〜 18:00 (L.O. 17:30)</p>
      <p><strong>定休日：</strong>水曜日・第2火曜日</p>
    </section>

    <section>
      <h2>☕ メニュー例</h2>
      <div class="menu-grid">
        <div class="menu-card">
          <h3>ルポブレンド</h3>
          <p>深煎りでコクのある、店主こだわりのブレンドコーヒー。</p>
        </div>
        <div class="menu-card">
          <h3>自家製シフォンケーキ</h3>
          <p>ふわふわ食感の優しい甘さのプレーンシフォン。</p>
        </div>
      </div>
    </section>

    <section>
      <h2>📍 アクセス</h2>
      <p>〒123-0045 東京都◯◯区◯◯町 1-2-3</p>
      <p>◯◯駅 徒歩5分（緑の看板が目印です）</p>
    </section>

  </div>

  <footer>
    <p>&copy; Cafe Repos All Rights Reserved.</p>
  </footer>

  <script>
    // 深い階層から再帰的にテキストを探し出す関数
    function findTitleText(obj) {
      if (!obj) return "";
      if (typeof obj === "string") return obj;
      
      // Notion特有の plain_text を探す
      if (obj.plain_text) return obj.plain_text;
      
      if (Array.isArray(obj)) {
        for (let item of obj) {
          let res = findTitleText(item);
          if (res) return res;
        }
      } else if (typeof obj === "object") {
        // properties内の「タイトル」「名前」「Name」「title」を優先捜索
        if (obj.properties) {
          const props = obj.properties;
          const target = props["タイトル"] || props["名前"] || props["Name"] || props["title"];
          if (target) {
            let res = findTitleText(target);
            if (res) return res;
          }
        }
        for (let key in obj) {
          if (key === "url" || key === "id") continue; // 不要なプロパティをスキップ
          let res = findTitleText(obj[key]);
          if (res) return res;
        }
      }
      return "";
    }

    async function fetchNotionData() {
      const webhookUrl = "https://hook.eu1.make.com/p5xkou7imteptt4okuumbnttl1qk8q6k";
      const newsContainer = document.getElementById("news-container");

      try {
        const response = await fetch(webhookUrl);
        const data = await response.json();
        
        newsContainer.innerHTML = "";

        if (data && (Array.isArray(data) ? data.length > 0 : Object.keys(data).length > 0)) {
          const items = Array.isArray(data) ? data : [data];
          let count = 0;

          items.forEach(item => {
            // ステータスチェック（「公開」が含まれているか、またはチェックなしの場合）
            const itemStr = JSON.stringify(item);
            
            // 「公開」状態のデータのみ表示（または全件表示）
            if (itemStr.includes("公開") || !itemStr.includes("下書き")) {
              let title = findTitleText(item);
              if (title && title !== "公開" && title !== "下書き" && title !== "お知らせ") {
                const li = document.createElement("li");
                li.className = "news-item";
                li.textContent = title;
                newsContainer.appendChild(li);
                count++;
              }
            }
          });

          if (count === 0) {
            newsContainer.innerHTML = '<li class="news-item">現在お知らせはありません。</li>';
          }
        } else {
          newsContainer.innerHTML = '<li class="news-item">現在お知らせはありません。</li>';
        }
      } catch (error) {
        console.error("エラー:", error);
        newsContainer.innerHTML = '<li class="news-item">お知らせの読み込みに失敗しました。</li>';
      }
    }

    fetchNotionData();
  </script>

</body>
</html>
